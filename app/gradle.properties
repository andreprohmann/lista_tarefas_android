# Configurações de Memória para o Gradle e o Kotlin Daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Habilita o cache de build para acelerar compilações futuras
org.gradle.caching=true

# Habilita compilação paralela sempre que possível
org.gradle.parallel=true

# Otimizações de configuração sob demanda
org.gradle.configureondemand=true

# Ativa o suporte ao AndroidX e conversão de bibliotecas legadas
android.useAndroidX=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
